<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-Line Approximation Leak Detection - League City, TX</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
        }

        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
        }

        .header {
            position: absolute;
            top: 20px;
            left: 50px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.85);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: none; 
        }

        .header h1 {
            margin: 0;
            color: #e2e8f0;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .header p {
            margin: 5px 0 0 0;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.9);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        select {
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.95rem;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        select:hover, select:focus {
            border-color: #38bdf8;
        }

        .custom-tooltip {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #38bdf8;
            color: #f8fafc;
            border-radius: 4px;
            font-family: monospace;
            padding: 6px 10px;
        }
        .leaflet-tooltip-left.custom-tooltip::before { border-left-color: #38bdf8; }
        .leaflet-tooltip-right.custom-tooltip::before { border-right-color: #38bdf8; }
    </style>
</head>
<body>

    <div class="header">
        <h1>C-Line Approximation Leak Detection</h1>
        <p>League City, TX | Satellite Pipeline Monitoring</p>
    </div>

    <div class="controls">
        <select id="quarter-select"></select>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        const map = L.map('map', {
            zoomControl: false 
        }).setView([29.504, -95.096], 15); // Zoomed in a bit more to see the dense grid

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // 3. Upgraded, Complex Pipeline Infrastructure (GeoJSON)
        // Now includes "type" properties to differentiate main lines from street-level distribution
        const pipelineData = {
            "type": "FeatureCollection",
            "features": [
                // TRANSMISSION MAINS (Heavy load)
                {
                    "type": "Feature",
                    "properties": {"name": "Primary Arterial Main", "type": "transmission"},
                    "geometry": {"type": "LineString", "coordinates": [[-95.120, 29.510], [-95.105, 29.508], [-95.090, 29.508], [-95.070, 29.512]]}
                },
                // DISTRIBUTION MAINS (Feeding subdivisions)
                {
                    "type": "Feature",
                    "properties": {"name": "Subdivision Feeder North", "type": "distribution"},
                    "geometry": {"type": "LineString", "coordinates": [[-95.105, 29.508], [-95.105, 29.518]]}
                },
                {
                    "type": "Feature",
                    "properties": {"name": "Subdivision Feeder South", "type": "distribution"},
                    "geometry": {"type": "LineString", "coordinates": [[-95.090, 29.508], [-95.090, 29.495]]}
                },
                // SERVICE LINES (Dense, residential street grids & loops)
                // North Grid
                { "type": "Feature", "properties": {"name": "Res Street 1", "type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.105, 29.512], [-95.095, 29.512]]} },
                { "type": "Feature", "properties": {"name": "Res Street 2", "type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.105, 29.515], [-95.095, 29.515]]} },
                { "type": "Feature", "properties": {"name": "Res Cross Street", "type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.095, 29.512], [-95.095, 29.518]]} },
                { "type": "Feature", "properties": {"name": "Cul-de-sac N1", "type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.105, 29.518], [-95.100, 29.518], [-95.100, 29.520]]} },
                
                // South Grid (Looped network for redundancy)
                { "type": "Feature", "properties": {"name": "South Loop Top", "type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.090, 29.503], [-95.080, 29.503]]} },
                { "type": "Feature", "properties": {"name": "South Loop Bottom", "type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.090, 29.498], [-95.080, 29.498]]} },
                { "type": "Feature", "properties": {"name": "South Loop Right", "type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.080, 29.503], [-95.080, 29.495]]} },
                { "type": "Feature", "properties": {"name": "Res Street 3", "type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.085, 29.503], [-95.085, 29.498]]} },
                { "type": "Feature", "properties": {"name": "Cul-de-sac S1", "type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.080, 29.495], [-95.075, 29.495]]} }
            ]
        };

        // Function to dynamically style pipes based on their classification
        function getPipeStyle(feature) {
            switch (feature.properties.type) {
                case 'transmission':
                    return { color: "#0ea5e9", weight: 5, opacity: 0.9, dashArray: '8, 6' };
                case 'distribution':
                    return { color: "#38bdf8", weight: 3, opacity: 0.7, dashArray: '5, 5' };
                case 'service':
                    return { color: "#7dd3fc", weight: 1.5, opacity: 0.5 };
                default:
                    return { color: "#38bdf8", weight: 2, opacity: 0.6 };
            }
        }

        L.geoJSON(pipelineData, {
            style: getPipeStyle
        }).addTo(map);

        // 4. Mock Hotspot Data (Recalibrated to snap to the new grid)
        const hotspotData = {
            "Q2 2024": [ [29.508, -95.105], [29.503, -95.085] ],
            "Q1 2024": [ [29.508, -95.105], [29.503, -95.085], [29.515, -95.095] ], 
            "Q4 2023": [ [29.515, -95.095], [29.498, -95.080], [29.510, -95.115] ],
            "Q3 2023": [ [29.498, -95.080], [29.510, -95.115] ],
            "Q2 2023": [ [29.498, -95.080], [29.512, -95.100], [29.518, -95.102] ],
            "Q1 2023": [ [29.512, -95.100], [29.518, -95.102] ],
            "Q4 2022": [ [29.518, -95.102], [29.503, -95.090], [29.495, -95.078] ],
            "Q3 2022": [ [29.503, -95.090], [29.495, -95.078] ],
            "Q2 2022": [ [29.503, -95.090], [29.508, -95.080] ],
            "Q1 2022": [ [29.508, -95.080], [29.498, -95.090], [29.512, -95.075] ]
        };

        let currentHotspotLayer = L.layerGroup().addTo(map);

        function updateHotspots(quarter) {
            currentHotspotLayer.clearLayers();
            const points = hotspotData[quarter];
            if (!points) return;

            points.forEach(coord => {
                const marker = L.circleMarker(coord, {
                    radius: 8,
                    fillColor: "#ef4444",
                    color: "#fca5a5",
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.8
                });

                const gpsText = `Lat: ${coord[0].toFixed(5)}<br>Lng: ${coord[1].toFixed(5)}`;
                marker.bindTooltip(gpsText, {
                    className: 'custom-tooltip',
                    direction: 'top',
                    offset: [0, -10]
                });

                currentHotspotLayer.addLayer(marker);
            });
        }

        const selectElement = document.getElementById('quarter-select');
        Object.keys(hotspotData).forEach(quarter => {
            const option = document.createElement('option');
            option.value = quarter;
            option.textContent = quarter;
            selectElement.appendChild(option);
        });

        const initialQuarter = Object.keys(hotspotData)[0];
        updateHotspots(initialQuarter);

        selectElement.addEventListener('change', (e) => {
            updateHotspots(e.target.value);
        });

    </script>
</body>
</html>
