<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-Line Approximation Leak Detection - League City, TX</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
        }

        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
        }

        .header {
            position: absolute;
            top: 20px;
            left: 50px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.85);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: none; 
        }

        .header h1 {
            margin: 0;
            color: #e2e8f0;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .header p {
            margin: 5px 0 0 0;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.9);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        select {
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.95rem;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        select:hover, select:focus {
            border-color: #38bdf8;
        }

        .custom-tooltip {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #38bdf8;
            color: #f8fafc;
            border-radius: 4px;
            font-family: monospace;
            padding: 6px 10px;
        }
        .leaflet-tooltip-left.custom-tooltip::before { border-left-color: #38bdf8; }
        .leaflet-tooltip-right.custom-tooltip::before { border-right-color: #38bdf8; }
    </style>
</head>
<body>

    <div class="header">
        <h1>C-Line Approximation Leak Detection</h1>
        <p>League City, TX | Satellite Pipeline Monitoring</p>
    </div>

    <div class="controls">
        <select id="quarter-select"></select>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        const map = L.map('map', {
            zoomControl: false 
        });

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // 1. Define and draw the Area of Interest (AOI) Bounding Box
        // Coordinates provided: West, South, East, North (approximate diamond shape)
        const aoiCoordinates = [
            [29.494267, -95.125236], // West corner
            [29.462288, -95.084982], // South corner
            [29.501663, -94.999237], // East corner
            [29.539754, -95.046100]  // North corner
        ];

        const aoiPolygon = L.polygon(aoiCoordinates, {
            color: '#475569',
            weight: 2,
            dashArray: '10, 10',
            fillColor: '#1e293b',
            fillOpacity: 0.1
        }).addTo(map);

        // Automatically frame the map to exactly fit the bounding box
        map.fitBounds(aoiPolygon.getBounds(), { padding: [20, 20] });

        // 2. High-Density Pipeline Infrastructure (GeoJSON) strictly inside the AOI
        // Note: GeoJSON uses [Longitude, Latitude] formats
        const pipelineData = {
            "type": "FeatureCollection",
            "features": [
                // === TRANSMISSION MAINS ===
                { "type": "Feature", "properties": {"type": "transmission"}, "geometry": {"type": "LineString", "coordinates": [[-95.110, 29.490], [-95.085, 29.485], [-95.060, 29.495], [-95.030, 29.505], [-95.010, 29.500]]} },
                { "type": "Feature", "properties": {"type": "transmission"}, "geometry": {"type": "LineString", "coordinates": [[-95.050, 29.525], [-95.060, 29.495], [-95.070, 29.475]]} },
                
                // === DISTRIBUTION MAINS ===
                { "type": "Feature", "properties": {"type": "distribution"}, "geometry": {"type": "LineString", "coordinates": [[-95.085, 29.485], [-95.095, 29.475]]} },
                { "type": "Feature", "properties": {"type": "distribution"}, "geometry": {"type": "LineString", "coordinates": [[-95.060, 29.495], [-95.075, 29.510]]} },
                { "type": "Feature", "properties": {"type": "distribution"}, "geometry": {"type": "LineString", "coordinates": [[-95.030, 29.505], [-95.035, 29.490]]} },
                
                // === SERVICE LINES (Neighborhood Clusters) ===
                
                // Cluster 1: South-West Grid
                { "type": "Feature", "properties": {"type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.095, 29.475], [-95.090, 29.475], [-95.090, 29.470], [-95.095, 29.470], [-95.095, 29.475]]} }, // Loop
                { "type": "Feature", "properties": {"type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.090, 29.475], [-95.085, 29.478]]} },
                { "type": "Feature", "properties": {"type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.090, 29.470], [-95.085, 29.468]]} },
                
                // Cluster 2: North-West Grid
                { "type": "Feature", "properties": {"type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.075, 29.510], [-95.085, 29.510], [-95.085, 29.505], [-95.075, 29.505]]} },
                { "type": "Feature", "properties": {"type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.080, 29.510], [-95.080, 29.515]]} }, // Cul-de-sac
                { "type": "Feature", "properties": {"type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.085, 29.505], [-95.090, 29.500]]} },
                
                // Cluster 3: Central Grid
                { "type": "Feature", "properties": {"type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.060, 29.495], [-95.050, 29.490], [-95.045, 29.495], [-95.055, 29.500]]} },
                { "type": "Feature", "properties": {"type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.050, 29.490], [-95.050, 29.480]]} },
                { "type": "Feature", "properties": {"type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.050, 29.485], [-95.040, 29.485]]} },
                
                // Cluster 4: Eastern Grid
                { "type": "Feature", "properties": {"type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.035, 29.490], [-95.025, 29.490], [-95.025, 29.485], [-95.035, 29.485], [-95.035, 29.490]]} },
                { "type": "Feature", "properties": {"type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.030, 29.490], [-95.030, 29.495]]} },
                { "type": "Feature", "properties": {"type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.025, 29.485], [-95.020, 29.480]]} },

                // Cluster 5: Far East Tail
                { "type": "Feature", "properties": {"type": "service"}, "geometry": {"type": "LineString", "coordinates": [[-95.010, 29.500], [-95.015, 29.495], [-95.010, 29.490]]} }
            ]
        };

        function getPipeStyle(feature) {
            switch (feature.properties.type) {
                case 'transmission':
                    return { color: "#0ea5e9", weight: 5, opacity: 0.9, dashArray: '8, 6' };
                case 'distribution':
                    return { color: "#38bdf8", weight: 3, opacity: 0.7, dashArray: '5, 5' };
                case 'service':
                    return { color: "#7dd3fc", weight: 1.5, opacity: 0.5 };
                default:
                    return { color: "#38bdf8", weight: 2, opacity: 0.6 };
            }
        }

        L.geoJSON(pipelineData, {
            style: getPipeStyle
        }).addTo(map);

        // 3. Hotspot Data mapped precisely to the new infrastructure
        // Format: [Latitude, Longitude]
        const hotspotData = {
            "Q2 2024": [ [29.475, -95.090], [29.490, -95.035] ],
            "Q1 2024": [ [29.475, -95.090], [29.490, -95.035], [29.510, -95.080] ], 
            "Q4 2023": [ [29.510, -95.080], [29.485, -95.040], [29.495, -95.060] ],
            "Q3 2023": [ [29.485, -95.040], [29.495, -95.060] ],
            "Q2 2023": [ [29.485, -95.040], [29.490, -95.050], [29.475, -95.070] ],
            "Q1 2023": [ [29.490, -95.050], [29.475, -95.070] ],
            "Q4 2022": [ [29.475, -95.070], [29.500, -95.010], [29.485, -95.085] ],
            "Q3 2022": [ [29.500, -95.010], [29.485, -95.085] ],
            "Q2 2022": [ [29.500, -95.010], [29.475, -95.095] ],
            "Q1 2022": [ [29.475, -95.095], [29.485, -95.085], [29.490, -95.035] ]
        };

        let currentHotspotLayer = L.layerGroup().addTo(map);

        function updateHotspots(quarter) {
            currentHotspotLayer.clearLayers();
            const points = hotspotData[quarter];
            if (!points) return;

            points.forEach(coord => {
                const marker = L.circleMarker(coord, {
                    radius: 8,
                    fillColor: "#ef4444",
                    color: "#fca5a5",
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.8
                });

                const gpsText = `Lat: ${coord[0].toFixed(5)}<br>Lng: ${coord[1].toFixed(5)}`;
                marker.bindTooltip(gpsText, {
                    className: 'custom-tooltip',
                    direction: 'top',
                    offset: [0, -10]
                });

                currentHotspotLayer.addLayer(marker);
            });
        }

        const selectElement = document.getElementById('quarter-select');
        Object.keys(hotspotData).forEach(quarter => {
            const option = document.createElement('option');
            option.value = quarter;
            option.textContent = quarter;
            selectElement.appendChild(option);
        });

        const initialQuarter = Object.keys(hotspotData)[0];
        updateHotspots(initialQuarter);

        selectElement.addEventListener('change', (e) => {
            updateHotspots(e.target.value);
        });

    </script>
</body>
</html>
